name: Validate textbook SET generator
on:
  pull_request:
  push:
    branches: [main, textbook-bank-update]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Source SET and seeded generator tests
        run: npm test
      - name: Type-check the application
        run: npm run typecheck
      - name: Build the production application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
